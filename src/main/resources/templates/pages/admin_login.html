<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-card {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="login-card">
        <h4 class="text-center mb-4">Đăng nhập Admin</h4>
        <form th:action="@{/admin/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" name="email" type="text" class="form-control" placeholder="Nhập email">
            </div>
            <div class="mb-3">
                <label for="pass" class="form-label">Mật khẩu</label>
                <input id="pass" name="pass" type="password" class="form-control" placeholder="Nhập mật khẩu">
            </div>
            <p class="text-danger text-center mb-3"
               th:if="${session.login_error}" th:text="${session.login_error}">
            </p>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Đăng nhập</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
